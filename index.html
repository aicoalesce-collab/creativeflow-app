<style>
:root{
  /* ── BRAND PALETTE ──────────────────────────────────────────────────────
     Primary rose, secondary violet, accent lime, on the two neutrals.

     The 50/35/15 split describes brand collateral, not an application. Half a
     screen of rose is unusable for eight hours a day, so here the neutrals do
     the carrying and the three brand colours are spent on meaning:
       rose   = this needs you, and every primary action
       violet = someone else has it (in review, with the requester)
       lime   = finished
     Nothing else may use them. */
  --bg:#f7f6f0; --card:#ffffff; --card2:#ffffff; --ink:#161a15; --line:#e6e6dc;
  --muted:#83887c; --soft:#eef0e6;
  --accent:#5c7d3d; --accent-ink:#ffffff; --accent-soft:#e9f0dd;
  --pill-line:#d5d8ca;
  /* State, all four drawn from the same night-meadow the welcome screen is:
       moss  = act — this needs you, and every primary action
       amber = someone else has it (in review, with the requester)
       teal  = finished and settled
       rose  = late. The ONLY pink in the product, so that seeing pink means
               something rather than meaning "a button". */
  --s-late:#c0405c; --s-review:#b07a22; --s-review-soft:#d3a44e;
  --s-good:#2f7f74; --s-good-soft:#8fd0c6; --s-hold:#9a9e92;
  --radius:14px; --slot:46px;
  /* Three faces, three jobs.
     display — The Seasons, for the wordmark and the few places a name should
       carry weight. A high-contrast serif: not for small text or data.
     dot     — Doto, kept for NUMBERS and ids, where a pixel face is genuinely
       good, and where the product's dot motif comes from.
     body    — everything anyone actually reads. */
  --font-display:"the-seasons",Georgia,'Times New Roman',serif;
  --font-dot:'Doto','Archivo',system-ui,sans-serif;
  --font-b:'Archivo',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(23,23,23,.05);
}
[data-theme="dark"] .s-done{color:#141414}
[data-theme="dark"]{
  /* Dark is the default now, so this is the face of the product. The ground is
     near-black with a faint green cast — the same night the welcome screen is
     lit against, rather than a neutral grey. */
  --bg:#0b0e0b; --card:#141814; --card2:#1a1f19; --ink:#eef1e6; --line:#262c24;
  --muted:#8d9385; --soft:#1a1f19;
  --accent:#a9cb6b; --accent-ink:#101410; --accent-soft:#22301a;
  --pill-line:#333a31;
  --s-late:#f07a95; --s-review:#e0a74e; --s-review-soft:#e0a74e;
  --s-good:#5fc9b8; --s-good-soft:#8fe0d2; --s-hold:#767c70;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-b);background:var(--bg);color:var(--ink);font-size:13.5px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
select,input,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:var(--accent)}
.dotf{font-family:var(--font-dot);font-weight:900;letter-spacing:.05em}
.betapill{border:1px solid var(--accent);color:var(--accent);border-radius:99px;font-size:8.5px;padding:2px 8px;letter-spacing:.14em;vertical-align:middle;font-family:var(--font-b);font-weight:500;margin-left:8px}
.gbtn-browser{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px;font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center}
.gbtn-browser:hover{border-color:var(--accent)}

/* ══ THE WELCOME SCREEN ═══════════════════════════════════════════════════
   A night meadow, lit from inside. Built entirely in CSS rather than shipped
   as artwork: a PWA that has to open fast on a studio phone cannot afford a
   two-megabyte photograph on its first screen, and gradients resize to any
   display without a second asset.

   Its palette is fixed and does not follow the theme. This screen is one
   committed image, not a surface with a light mode. */
#login{
  --w-void:#04070a;      /* the sky at the top — black with a cold green bias */
  --w-deep:#070d0b;
  --w-teal:#0d4a4a;      /* the bloom behind the horizon */
  --w-teal-hi:#1f8b7f;
  --w-moss:#5d8129;      /* the lit grass */
  --w-moss-hi:#c3e07a;
  --w-cream:#f2efe2;     /* petals, and every word on this screen */
  position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:16px;overflow:hidden;
  background:var(--w-void);color:var(--w-cream);
  transition:opacity .5s ease, filter .5s ease}
#login.w-out{opacity:0;filter:blur(6px);pointer-events:none}

.w-sky{position:absolute;inset:0;pointer-events:none}
.w-sky>span{position:absolute;inset:0;display:block}
/* the teal bloom, sitting just above the horizon like the reference */
.w-bloom{background:
  radial-gradient(78% 44% at 50% 78%, rgba(31,139,127,.42), rgba(13,74,74,.20) 46%, transparent 72%),
  radial-gradient(120% 78% at 50% 116%, rgba(13,74,74,.55), transparent 70%)}
/* the horizon: moss light burning out of the ground, and the dark bank in front */
.w-meadow{background:
  radial-gradient(50% 16% at 50% 100%, rgba(214,236,150,.62), rgba(122,163,55,.26) 48%, transparent 76%),
  radial-gradient(92% 25% at 50% 107%, rgba(93,129,41,.50), transparent 68%),
  linear-gradient(180deg, transparent 58%, rgba(7,13,11,.50) 82%, #050907 100%)}
/* the sky is the product's own dot grid — the reference has one too */
.w-stars{
  background-image:radial-gradient(rgba(242,239,226,.62) 1px, transparent 1px);
  background-size:34px 34px;background-position:8px 8px;
  -webkit-mask-image:radial-gradient(72% 58% at 50% 34%, #000 12%, transparent 78%);
  mask-image:radial-gradient(72% 58% at 50% 34%, #000 12%, transparent 78%);
  opacity:.5;animation:wtwinkle 7s ease-in-out infinite}
@keyframes wtwinkle{0%,100%{opacity:.34}50%{opacity:.62}}
/* the artwork. Fades up once decoded so it arrives rather than snapping in. */
.w-photo{background:no-repeat center/cover url("bg/welcome-wide.jpg");
  opacity:0;animation:wphoto 1.5s ease .95s forwards}
@keyframes wphoto{to{opacity:1}}
.w-vig{background:radial-gradient(120% 92% at 50% 46%, transparent 44%, rgba(2,4,3,.72) 100%)}
/* The controls need a ground to sit on. The photograph is at its busiest
   exactly where the dock lands — dandelions, sketches, a laptop — so the light
   is pulled out from under it with a soft feathered scrim rather than a card,
   which would put a box on top of a poster. */
.w-dock::before{content:'';position:absolute;left:-90px;right:-90px;top:-56px;bottom:-70px;z-index:-1;
  background:radial-gradient(58% 62% at 50% 52%, rgba(3,6,5,.93), rgba(3,6,5,.80) 46%, rgba(3,6,5,.45) 70%, transparent 88%)}

/* ── the wordmark ──
   It glows because the whole scene is lit from within; the halo is teal so the
   light on the letters looks like it comes from the meadow, not from a filter. */
.w-mark{position:relative;text-align:center;z-index:2;
  animation:wrise 1.0s cubic-bezier(.2,.75,.25,1) .15s both}
@keyframes wrise{from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(7px)}
                 to{opacity:1;transform:none;filter:none}}
.w-dots{display:block;width:52px;height:10px;margin:0 auto 20px;opacity:.55;
  background-image:radial-gradient(var(--w-moss-hi) 1.7px, transparent 1.7px);background-size:9px 9px}
.w-cap{display:inline-block;position:relative;padding:13px 32px;border-radius:999px;
  border:1px solid rgba(242,239,226,.16);
  background:radial-gradient(120% 150% at 50% 120%, rgba(31,139,127,.16), transparent 70%)}
/* the bright underline the reference capsule has */
.w-cap::after{content:'';position:absolute;left:22%;right:22%;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(242,239,226,.75),transparent)}
/* The real logotype, not type set to look like it. A drop-shadow rather than a
   text-shadow, because it is a picture — same halo, and it follows the letter
   shapes instead of a box. */
.login-logo{display:block;width:clamp(210px,44vw,330px);height:auto;
  animation:wglow 6s ease-in-out infinite}
@keyframes wglow{
  0%,100%{filter:drop-shadow(0 0 12px rgba(242,239,226,.30)) drop-shadow(0 0 40px rgba(31,139,127,.30))}
  50%    {filter:drop-shadow(0 0 18px rgba(242,239,226,.48)) drop-shadow(0 0 58px rgba(31,139,127,.46))}}

/* ── the dock ──
   Rises into the scene once the mark has settled, so the first thing anyone
   sees is the studio's name rather than a form. */
.w-dock{position:relative;z-index:3;width:392px;max-width:100%;margin-top:44px;
  display:flex;flex-direction:column;gap:13px;
  opacity:0;transform:translateY(26px);
  animation:wdock .62s cubic-bezier(.2,.8,.24,1) 2.05s both}
@keyframes wdock{to{opacity:1;transform:none}}
#login.w-solo .w-dock,#login.w-solo .w-gear{display:none}
/* Everything on this screen is centred on one axis — the mark, the labels, the
   fields, the button. It is a poster with a form in it, not a form. */
.w-dock{text-align:center}
.w-row label{display:block;font-size:9.5px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(242,239,226,.5);margin-bottom:7px}
.w-row input{width:100%;padding:13px 14px;font-size:14px;border-radius:13px;text-align:center;
  background:rgba(6,11,9,.62);border:1px solid rgba(242,239,226,.24);color:var(--w-cream);
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px)}
.w-row input::placeholder{color:rgba(242,239,226,.3)}
.w-row input:focus{border-color:rgba(195,224,122,.55);background:rgba(242,239,226,.09);
  box-shadow:0 0 0 3px rgba(93,129,41,.22)}

/* the code, one character per box */
.w-code{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.w-code input{width:100%;padding:0;height:54px;text-align:center;border-radius:13px;
  font-family:var(--font-dot);font-weight:900;font-size:22px;letter-spacing:0;
  text-transform:uppercase;color:var(--w-cream);
  background:rgba(242,239,226,.07);border:1px solid rgba(242,239,226,.19);
  transition:border-color .16s,background .16s,box-shadow .16s}
.w-code input:focus{border-color:rgba(195,224,122,.7);background:rgba(242,239,226,.1);
  box-shadow:0 0 0 3px rgba(93,129,41,.24)}
.w-code input.on{border-color:rgba(195,224,122,.4)}
/* the real field the API reads — present and fillable, never in the way */
.w-code-real{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;padding:0;border:0}
.w-hide{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}

/* the one button: the height of the navigation bar, and the only lit surface */
.login-btn{width:100%;height:58px;border-radius:19px;margin-top:5px;
  font-family:var(--font-b);font-weight:500;font-size:15px;letter-spacing:.02em;
  color:#0a0f0c;background:linear-gradient(180deg,#ffffff 0%,#f6f5ea 56%,#e9ebda 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.5),0 14px 40px rgba(31,139,127,.30),0 0 58px rgba(255,255,255,.13);
  transition:transform .14s ease, box-shadow .2s ease}
.login-btn:hover{transform:translateY(-1px);
  box-shadow:0 0 0 1px rgba(255,255,255,.66),0 18px 48px rgba(195,224,122,.30),0 0 74px rgba(255,255,255,.20)}
.login-btn:active{transform:translateY(0)}
.login-btn:disabled{opacity:.62;cursor:wait;transform:none}

.login-err{border-radius:13px;padding:11px 14px;font-size:12.5px;line-height:1.55;display:none;text-align:center;
  background:rgba(192,64,92,.14);color:#f5a8b8;border:1px solid rgba(192,64,92,.45)}
.login-err.ok{background:rgba(31,139,127,.14);color:#8fd8cb;border-color:rgba(31,139,127,.5)}

/* first-run only: the sheet URL. Everything else that used to be printed here
   — taglines, the code-request note, remember-me, the connected URL — is gone. */
.lfield label{display:block;font-size:9.5px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(242,239,226,.5);margin-bottom:7px;padding-left:2px}
.lfield input{width:100%;padding:13px 14px;border-radius:13px;
  background:rgba(6,11,9,.62);border:1px solid rgba(242,239,226,.24);color:var(--w-cream);
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px)}
.lfield details{margin-top:8px;font-size:11.5px;color:rgba(242,239,226,.45)}
.lfield summary{cursor:pointer;color:var(--w-moss-hi);font-weight:500}

/* the escape hatch, folded into a corner instead of a paragraph */
.w-gear{position:absolute;right:16px;bottom:14px;z-index:4;width:34px;height:34px;border-radius:99px;
  color:rgba(242,239,226,.42);border:1px solid rgba(242,239,226,.13);font-size:14px;line-height:1;
  animation:wdock .5s ease 2.5s both}
.w-gear:hover{color:var(--w-cream);border-color:rgba(242,239,226,.3)}
.w-conn{position:absolute;right:16px;bottom:56px;z-index:4;width:min(330px,calc(100% - 32px));
  padding:13px 15px;border-radius:15px;display:none;
  background:rgba(9,14,12,.9);border:1px solid rgba(242,239,226,.13);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.w-conn.open{display:block}
.saved-url{font-size:11px;color:rgba(242,239,226,.45);word-break:break-all}
.saved-url b{color:rgba(242,239,226,.7);font-weight:500}
.changelink{font-size:11.5px;margin-top:9px}
#login a{color:var(--w-moss-hi)}
.gwrap{display:none}

/* On a wide screen the composition follows the reference: the mark high, the
   controls low, and the meadow burning away underneath in between. */
@media (min-width:741px){
  #login{justify-content:center}
  .w-dock{margin-top:min(9vh,74px)}
}
@media (max-width:740px){
  #login{padding:0 18px calc(20px + env(safe-area-inset-bottom));justify-content:center}
  .w-mark{margin:0}
  .w-dock{margin:30px 0 0;width:100%}
  .w-code{gap:7px}
  .w-code input{height:52px;font-size:20px}
  /* A phone is tall and narrow: the desktop bloom sits below the fold behind
     the controls, leaving the top half flat black. Everything moves up so the
     light is behind the mark and the meadow still burns around the button. */
  .w-bloom{background:
    radial-gradient(104% 32% at 50% 60%, rgba(31,139,127,.44), rgba(13,74,74,.20) 50%, transparent 76%),
    radial-gradient(150% 56% at 50% 108%, rgba(13,74,74,.50), transparent 74%)}
  .w-meadow{background:
    radial-gradient(76% 12% at 50% 100%, rgba(214,236,150,.55), rgba(122,163,55,.24) 52%, transparent 80%),
    radial-gradient(130% 19% at 50% 105%, rgba(93,129,41,.46), transparent 72%),
    linear-gradient(180deg, transparent 64%, rgba(7,13,11,.38) 88%, #050907 100%)}
  .w-stars{opacity:.6;
    -webkit-mask-image:radial-gradient(98% 48% at 50% 29%, #000 22%, transparent 86%);
    mask-image:radial-gradient(98% 48% at 50% 29%, #000 22%, transparent 86%)}
  /* the portrait crop of the artwork — the landscape one loses the meadow
     entirely once a phone crops it to a 9:19.5 frame */
  .w-photo{background-image:url("bg/welcome-tall.jpg")}
}
@media (prefers-reduced-motion:reduce){
  .w-mark,.w-dock,.w-gear{animation:none;opacity:1;transform:none}
  .login-logo,.w-stars{animation:none}
  #login{transition:none}
}

/* ── shell ─────────────────────────── */
#app{display:none;grid-template-columns:226px 1fr;height:100vh}
#app.ready{display:grid}
#rail{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;overflow-y:auto}
.logo{display:block;width:150px;height:auto;margin:0 10px 2px}
/* The logotype ships white — the only colour it comes in. In light mode a pure
   inversion of a pure white gives pure ink, so no second file is needed. */
[data-theme="light"] #app .brandmark{filter:invert(1)}
.logo-sub{font-size:9.5px;color:var(--muted);padding:0 10px 22px;letter-spacing:.14em;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 11px;border-radius:11px;color:var(--muted);font-weight:500;margin-bottom:3px;font-size:13px}
.nav-btn:hover{background:var(--soft);color:var(--ink)}
.nav-btn.active{background:var(--soft);color:var(--ink)}
.nav-btn .ic{width:17px;text-align:center;font-size:13px}
.nav-badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:500;border-radius:99px;padding:1px 7px}
#newtask-btn{margin-top:16px;background:var(--accent);color:var(--accent-ink);font-weight:500;border-radius:11px;padding:11px;text-align:center;letter-spacing:.02em}
#newtask-btn:hover{filter:brightness(.94)}
#bulk-btn{margin-top:8px;padding:10px;border:1px dashed var(--pill-line);border-radius:11px;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--muted);text-align:center}
#bulk-btn:hover{border-color:var(--accent);color:var(--accent)}
.rail-spacer{flex:1}
.acct{border:1px dashed var(--pill-line);border-radius:12px;padding:12px;margin-top:14px;font-size:11.5px;line-height:1.6}
.acct b{color:var(--ink)}
.acct .links{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.acct a{text-decoration:none;font-weight:500}
.acct a:hover{text-decoration:underline}
.acct .out{margin-top:10px;display:flex;gap:7px}
.acct .out button{border:1px solid var(--pill-line);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--muted)}
.acct .out button:hover{border-color:var(--accent);color:var(--accent)}

#main{display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line)}
#view-title{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-.01em}
#topbar .sub{color:var(--muted);font-size:11.5px;margin-top:1px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
#sync{font-size:10.5px;color:var(--muted);border:1px solid var(--pill-line);border-radius:99px;padding:4px 11px;white-space:nowrap;letter-spacing:.04em}
#sync.busy{color:var(--accent);border-color:var(--accent)}
#sync.off{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
/* Stale is amber, not alarm-coloured: the board is a few minutes old, which is
   worth noticing and is not an emergency. `off` is kept for a genuine, lasting
   failure — nothing routine should ever reach it. */
#sync.stale{color:var(--s-review);border-color:color-mix(in srgb,var(--s-review) 45%,var(--line));cursor:help}
.iconbtn{width:34px;height:34px;border:1px solid var(--pill-line);border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
#bell{position:relative}
#bell-count{position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--accent-ink);font-size:9px;font-weight:500;border-radius:99px;padding:1px 5px;min-width:15px;text-align:center}
.userchip{display:flex;align-items:center;gap:10px}
.avatar{border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-weight:500;color:#fff;flex:none}
.userchip .un{font-weight:500;font-size:12.5px;line-height:1.2}
.role-pill{display:inline-block;border:1px solid var(--pill-line);border-radius:99px;padding:1.5px 9px;font-size:9px;font-weight:500;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
#content{flex:1;overflow-y:auto;padding:24px 28px 44px}

/* ── greeting ──────────────────────── */
.greet .hi{font-size:12px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.greet .name{font-family:var(--font-display);font-weight:700;font-size:52px;letter-spacing:-.02em;line-height:1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.greet .line{color:var(--muted);font-size:13px;margin:6px 0 22px}
.dotsep{height:10px;margin:2px 0 22px;background-image:radial-gradient(var(--pill-line) 1.2px, transparent 1.3px);background-size:9px 9px;background-repeat:repeat-x;background-position:0 center}

/* ── overview grid ─────────────────── */
.ov-grid{display:grid;grid-template-columns:1fr 318px;gap:16px;align-items:start}
.ov-grid>*{min-width:0}
@media (max-width:1220px){.ov-grid{grid-template-columns:1fr}}

/* ── kpi cards ─────────────────────── */
/* ── the stat rail ─────────────────────
   Five boxed KPIs used to open the dashboard, all the same size, so the eye had
   nowhere to land — the one that meant "act" looked exactly like the one that
   meant "nice week". They are now a single quiet rail below the queue: still a
   glance, no longer the headline, and each one filters the list it counts. */
.statrail{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 16px}
.stat{display:flex;align-items:baseline;gap:7px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:6px 14px 6px 12px;cursor:pointer;box-shadow:var(--shadow);
  transition:border-color .15s,transform .12s}
.stat:hover{border-color:var(--pill-line);transform:translateY(-1px)}
.stat .sn{font-family:var(--font-dot);font-weight:700;font-size:17px;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;line-height:1}
.stat .sl{font-size:9.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.stat-hot .sn{color:var(--s-late)}
.stat-hot{border-color:color-mix(in srgb,var(--s-late) 40%,var(--line))}

/* ── needs you ─────────────────────────
   The one panel that answers "what am I meant to do now". Each row carries the
   reason it is here, because "why is this in front of me" is the question a
   list of task titles cannot answer. */
.needs{padding-bottom:8px}
.nrow{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:11px;
  padding:9px 4px 9px 11px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.nrow:first-of-type{border-top:0}
.nrow::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:99px;background:var(--muted)}
.nrow.n-late::before{background:var(--s-late)}
.nrow.n-review::before{background:var(--s-review)}
.nrow.n-fix::before{background:var(--s-late);opacity:.7}
.nrow.n-new::before{background:var(--accent)}
.nrow.n-today::before{background:var(--ink)}   /* same ink the in-progress row bar uses */
.nrow:hover{background:var(--soft)}
.nwhy{font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.n-late .nwhy{color:var(--s-late)}
.n-review .nwhy{color:var(--s-review)}
.n-new .nwhy{color:var(--accent)}
.ntt{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntt small{display:block;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.03em;margin-top:2px}
/* The CTA has to read as a button. It is the only control in the row and the
   row itself is clickable, so without an outline it looks like a label. */
.nbtn{padding:6px 14px;font-size:10.5px;letter-spacing:.07em;border:1px solid var(--pill-line);
  border-radius:99px;background:var(--card);font-weight:500;white-space:nowrap}
.nrow:hover .nbtn{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.n-late .nbtn,.n-new .nbtn{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent)}
.n-late:hover .nbtn,.n-new:hover .nbtn{background:var(--accent);border-color:var(--accent);color:#fff}
.nmore{margin:8px 0 6px}
.needs-clear .clear-note{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0 20px;text-align:center}
.clear-note b{font-size:14px}
.clear-note span:last-child{font-size:11.5px;color:var(--muted)}
.clear-dots{width:72px;height:22px;opacity:.5;margin-bottom:6px}

/* ── panels & chips ────────────────── */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;margin-bottom:14px;box-shadow:var(--shadow)}
.panel h3{font-size:11px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 .count{color:var(--muted);font-weight:500}
.panel h3 .right{margin-left:auto;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:500}
.empty{color:var(--muted);font-size:12.5px;padding:8px 0}
.chip{display:inline-block;border-radius:99px;padding:2.5px 10px;font-size:9.5px;font-weight:500;white-space:nowrap;letter-spacing:.08em;text-transform:uppercase}
.p-Urgent{background:var(--accent);color:var(--accent-ink)}
.p-High{border:1px solid var(--pill-line);color:var(--ink)}
.p-Medium{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.p-Low{border:1px solid var(--pill-line);color:var(--muted)}
.s-chip{border:1px solid var(--pill-line);color:var(--muted)}
.s-done{background:var(--s-good-soft);color:#2f4a06;border:1px solid var(--s-good-soft);font-weight:500}
.s-review{border:1px solid var(--s-review);color:var(--s-review);background:transparent}
.s-rejected{border:1px solid var(--s-late);color:var(--s-late)}

.rvq{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px dashed var(--line);cursor:pointer;border-radius:8px}
.rvq:hover{background:var(--soft)}
.rvq:last-child{border-bottom:none}
.rvq-id{color:var(--accent);font-size:13px;white-space:nowrap}
.rvq-b{flex:1;min-width:0}
.rvq-t{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvq-m{font-size:11px;color:var(--muted);margin-top:2px}
.rvq-go{color:var(--muted)}
#rv-ver{padding:7px 10px;border-radius:9px;font-size:12px}
.od-chip{background:var(--s-late);color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.team-dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:6px;vertical-align:0}

/* ── overdue strip ─────────────────── */
.od-strip{background:var(--s-late);color:#fff;border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.od-dot{width:9px;height:9px;border-radius:99px;background:var(--accent-ink);animation:pulse 1.4s infinite}
.od-strip b{font-family:var(--font-dot);font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:12.5px}
.od-pill{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 12px;font-size:11.5px;cursor:pointer}
[data-theme="dark"] .od-pill{background:rgba(0,0,0,.22)}
.od-pill:hover{filter:brightness(1.1)}

/* ── task rows ─────────────────────── */
.ttabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:8px}
.ttab{padding:7px 12px;font-size:11.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ttab.on{color:var(--ink);border-bottom-color:var(--accent)}
.trow{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.trow:last-child{border-bottom:none}
.trow:hover{background:var(--soft)}
/* One state vocabulary: a 3px bar you learn once and then never read a status
   word again. Density varies with urgency — late is heavier, finished recedes. */
.trow{border-left:3px solid transparent;padding-left:9px;transition:opacity .15s}
.trow--late{border-left-color:var(--s-late)}
.trow--review{border-left-color:var(--s-review-soft)}
.trow--now{border-left-color:var(--ink)}
.trow--new{border-left-color:var(--muted)}
.trow--hold{border-left-color:var(--pill-line)}
.trow--done{border-left-color:var(--s-good-soft);opacity:.55}
.trow--done .tt{font-weight:500}
.trow--done:hover{opacity:1}
.trow--late .tt{font-weight:500}
.trow .tid{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;width:56px;flex:none;letter-spacing:.03em}
.trow .tt{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.trow .tt small{display:block;font-weight:500;color:var(--muted);font-size:10.5px;margin-top:1px}
.trow .due{font-size:11px;color:var(--muted);white-space:nowrap;font-weight:500}
.trow .due.ok{color:var(--muted);font-weight:500}
.trow .due.late{color:var(--s-late);font-weight:500}

table.tasks{width:100%;border-collapse:collapse}
table.tasks th{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:500}
table.tasks td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tasks tr.rowlink{cursor:pointer}
table.tasks tr.rowlink:hover{background:var(--soft)}
table.tasks tr.overdue-row td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters input[type=search]{min-width:200px}
.mini-sel{padding:5px 8px;font-size:12px;border-radius:8px}

/* ── right rail widgets ────────────── */
.notif-item{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--soft);border-radius:8px}
.notif-item .ni{width:30px;height:30px;border:1px solid var(--pill-line);border-radius:99px;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.notif-item.hot .ni{border-color:var(--s-late);color:var(--s-late)}
.notif-item.hot .dot{background:var(--s-late)}
.notif-item .nt{color:var(--muted);font-size:10.5px;margin-top:2px}
.notif-item .dot{width:7px;height:7px;border-radius:99px;background:var(--muted);flex:none;margin-top:5px}
.mcal{width:100%;border-collapse:collapse;text-align:center;font-size:11px}
.mcal th{color:var(--muted);font-weight:500;font-size:9.5px;letter-spacing:.08em;padding:4px 0}
.mcal td{padding:2px 0}
.mcal .dcell{width:32px;height:30px;line-height:30px;border-radius:9px;cursor:pointer;position:relative;display:inline-block}
.mcal .dcell:hover{background:var(--soft)}
.mcal .dim{color:var(--muted);opacity:.45}
.mcal .today{background:var(--ink);color:var(--bg);font-weight:500}
.mcal .has::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:99px;background:var(--accent)}
.mcal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mcal-head b{font-family:var(--font-dot);font-weight:900;letter-spacing:.06em;font-size:13px;text-transform:uppercase}
.mcal-head button{color:var(--muted);padding:2px 8px;border:1px solid var(--pill-line);border-radius:8px;font-size:11px}

/* ── workload bars ─────────────────── */
.bar-row{display:grid;grid-template-columns:132px 1fr 74px;gap:10px;align-items:center;margin-bottom:9px;font-size:12px}
.bar-row .who{display:flex;align-items:center;gap:8px;min-width:0}
.bar-row .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row>span:last-child{white-space:nowrap;font-size:11px;color:var(--muted);text-align:right}
.bar-track{background:var(--soft);border-radius:99px;height:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px}

/* ── calendar ──────────────────────── */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-head h2{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.cal-nav{display:flex;gap:4px}
.cal-nav button,.ghostbtn{border:1px solid var(--pill-line);background:var(--card);border-radius:99px;padding:6px 13px;font-weight:500;font-size:12px}
.cal-nav button:hover,.ghostbtn:hover{border-color:var(--accent);color:var(--accent)}
.legend{margin-left:auto;display:flex;gap:12px;font-size:10.5px;color:var(--muted);align-items:center;flex-wrap:wrap;letter-spacing:.04em}
.lg-dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:5px;vertical-align:-1px}
.od-lane{background:var(--accent-soft);border:1px dashed var(--s-late);border-radius:var(--radius);padding:10px 13px;margin-bottom:10px}
.od-lane .lbl{font-size:9.5px;font-weight:500;color:var(--s-late);letter-spacing:.12em;margin-bottom:8px;text-transform:uppercase}
.od-lane-items{display:flex;gap:8px;flex-wrap:wrap}
.cal-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;position:relative;box-shadow:var(--shadow)}
.cal-grid{display:grid;grid-template-columns:54px repeat(7,minmax(116px,1fr));min-width:900px}
.cal-day-head{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:10px;color:var(--muted);position:sticky;top:0;background:var(--card);z-index:5;letter-spacing:.1em;text-transform:uppercase}
.cal-day-head b{display:block;font-family:var(--font-dot);font-weight:900;font-size:16px;color:var(--ink);letter-spacing:.03em}
.cal-day-head.today b{color:var(--accent)}
.cal-gutter{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:5}
.time-cell{height:var(--slot);font-size:9.5px;color:var(--muted);text-align:right;padding:2px 7px 0 0;border-top:1px solid var(--line)}
.day-col{position:relative;border-left:1px solid var(--line);background:
  repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--slot) - 1px),var(--line) calc(var(--slot) - 1px),var(--line) var(--slot))}
.day-col.today{background-color:var(--accent-soft)}
.day-col.droptarget{outline:2px dashed var(--accent);outline-offset:-2px}
.cal-task{position:absolute;left:4px;right:4px;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:9px;padding:4px 8px;font-size:11px;overflow:hidden;cursor:grab;box-shadow:var(--shadow);user-select:none;touch-action:none}
.cal-task:hover{box-shadow:0 4px 14px rgba(27,27,27,.14);z-index:4}
.cal-task.done{opacity:.5;text-decoration:line-through}
.cal-task.late{background:var(--accent-soft);border-color:var(--accent);border-left-color:var(--accent) !important}
.cal-task .ct-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px}
.cal-task .ct-m{color:var(--muted);font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:3;pointer-events:none}
.now-line::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:99px;background:var(--accent)}
.drag-ghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;width:180px;transform:rotate(1.5deg);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.cal-hint{font-size:11px;color:var(--muted);margin-top:9px}

/* ── reports ───────────────────────── */
.rep-head{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.stat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-bottom:14px}
/* ── number blocks (Reports) ──
   Hierarchy by SIZE, not by weight: the figure is large and light, the name is
   small and quiet. Nothing here is bold — a screen of bold numbers has no
   emphasis left to spend on the one that matters. */
/* The grid these tiles live in. It was deleted when the dashboard KPIs became
   the stat rail, which quietly un-styled every number in Reports — both the
   "your numbers" row and the combined-team panels, which stacked into a plain
   list of label/value pairs. */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
/* Each figure gets its own box. Laid bare on the panel they ran together into
   a field of numbers with nothing separating one measure from the next — the
   card is what makes "12 tasks given" a single readable object. */
.kpi{min-width:0;background:var(--card2);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 14px 12px;box-shadow:var(--shadow)}
.kpi.alert{border-color:color-mix(in srgb,var(--s-late) 45%,var(--line))}
.kpi .k-v{font-family:var(--font-dot);font-size:31px;font-weight:700;line-height:1.05;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;margin-bottom:3px}
.kpi .k-l{font-size:9.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.kpi .k-s{font-size:10.5px;color:var(--muted);margin-top:2px}
@media (max-width:740px){ .kpi .k-v{font-size:25px} }
.kpi .n{font-family:var(--font-dot);font-size:36px;font-weight:700;line-height:1.05;letter-spacing:.03em;
  font-variant-numeric:tabular-nums;margin-bottom:3px}
.kpi .lbl{font-size:9.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.kpi .cap{font-size:10.5px;color:var(--muted);margin-top:2px}
.kpi .cap.hot{color:var(--s-late)}
.kpi.alert .n{color:var(--s-late)}
@media (max-width:740px){ .kpi .n{font-size:28px} }
/* report tables: every numeric column, not the three that happened to have it */
table.tasks td,table.tasks th,.rep-tbl td,.rep-tbl th,.log-tbl td,.log-tbl th{font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
svg text{font-family:var(--font-b)}

/* ── bell dropdown ─────────────────── */
#notif-panel{position:absolute;top:56px;right:96px;width:330px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.18);z-index:60;display:none;max-height:70vh;overflow:auto;padding:6px 12px}
#notif-panel.open{display:block}
#notif-panel .nh{padding:10px 2px;border-bottom:1px solid var(--line);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase}

/* ── modal / toast ─────────────────── */
#overlay{position:fixed;inset:0;background:rgba(20,20,20,.5);display:none;align-items:flex-start;justify-content:center;z-index:80;padding:5vh 16px}
#overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;width:570px;max-width:100%;max-height:88vh;overflow:auto;padding:24px 26px}
.modal h2{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin-bottom:5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.modal .msub{color:var(--muted);font-size:12px;margin-bottom:16px}
/* ── ask: the app's own prompt ─────────
   window.prompt() returns null INSTANTLY in an installed PWA on iOS, which is
   indistinguishable from Cancel — the send-back note simply never happened and
   nothing on screen said why. This does the same job everywhere the app runs,
   and it takes more than one line, which a note explaining nine wrong files
   badly needed. It sits above #overlay because it opens on top of a task. */
#ask{position:fixed;inset:0;background:rgba(20,20,20,.55);display:none;align-items:center;justify-content:center;z-index:120;padding:5vh 16px}
#ask.open{display:flex}
#ask .modal{width:470px}
#ask textarea{width:100%;min-height:104px;resize:vertical}

/* ── the brief page ────────────────────
   The composer is right for eleven tasks out of twelve — "Instagram carousel,
   Thursday, Maya" does not want a page. This is for the twelfth: a real brief
   that runs to paragraphs, the client's reference material shown as PICTURES
   rather than four filenames, and what the campaign already contains sitting
   in the corner where it keeps the new piece consistent with the last twenty.
   Same task record either way in — this is only more room to fill it in. */
#brief{position:fixed;inset:0;background:var(--bg);display:none;z-index:110;overflow:auto}
#brief.open{display:block}
.bp{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.bp-bar{display:flex;align-items:center;gap:11px;padding:12px 18px;border-bottom:1px solid var(--line);
  background:var(--card);position:sticky;top:0;z-index:2;flex-wrap:wrap}
.bp-crumb{font-size:12px;color:var(--muted)}
.bp-crumb b{color:var(--accent)}
.bp-grow{flex:1 1 auto}
.bp-saved{font-family:var(--font-dot);font-size:11px;color:var(--muted);letter-spacing:.06em}
.bp-cols{display:grid;grid-template-columns:1fr 316px;flex:1 1 auto;align-items:stretch}
.bp-main{padding:22px 24px 40px;display:flex;flex-direction:column;gap:22px;min-width:0}
/* The rail's panel runs the full height of the page — it is a side of the
   sheet, not a floating card — while its CONTENTS stay in view as a long brief
   scrolls past them. */
.bp-side{border-left:1px solid var(--line);background:var(--soft);padding:20px 18px 40px}
.bp-rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:77px}
.bp-title{background:transparent;border:none;border-bottom:1px solid transparent;color:var(--ink);
  font:700 27px/1.24 var(--font-b);letter-spacing:-.015em;outline:none;width:100%;padding:2px 0}
.bp-title::placeholder{color:var(--muted);font-weight:500}
.bp-title:focus{border-bottom-color:var(--accent)}
.bp-block{display:flex;flex-direction:column;gap:9px}
.bp-lab{font-size:10px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.bp-lab .c{letter-spacing:0;text-transform:none;font-size:11px;font-weight:400}
#bp-desc{width:100%;min-height:190px;resize:vertical;line-height:1.65;font-size:14px}
/* references, shown as pictures */
.bp-assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:11px}
.bp-as{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);position:relative}
.bp-as img{display:block;width:100%;height:96px;object-fit:cover;background:var(--soft)}
.bp-as .ph{height:96px;display:grid;place-items:center;background:var(--soft);font-size:26px;color:var(--muted)}
.bp-as .an{padding:7px 9px;font-size:11px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp-as .ak{position:absolute;top:6px;right:6px;font-family:var(--font-dot);font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;background:rgba(0,0,0,.62);color:#fff;padding:2px 6px;border-radius:5px}
.bp-as .rm{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.62);
  color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center}
.bp-as .rm:hover{background:var(--s-late)}
.bp-drop{border:1.5px dashed var(--pill-line);border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;padding:18px 10px;text-align:center;color:var(--muted);
  cursor:pointer;min-height:124px}
.bp-drop:hover,.bp-drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.bp-drop b{font-size:12px;color:var(--ink)}
.bp-drop span{font-size:10.5px}
/* links */
.bp-links{display:flex;flex-direction:column;gap:7px}
.bp-link{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:8px 11px;font-size:12.5px}
.bp-link .u{color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.bp-link .x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1}
.bp-link .x:hover{color:var(--s-late)}
.bp-addlink{background:none;border:1px dashed var(--pill-line);color:var(--muted);border-radius:8px;
  padding:9px 11px;font:500 12px var(--font-b);cursor:pointer;text-align:left}
.bp-addlink:hover{color:var(--accent);border-color:var(--accent)}
/* the rail */
.bp-fld{display:flex;flex-direction:column;gap:6px}
.bp-fld label{font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bp-fld input,.bp-fld select{width:100%}
.bp-row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bp-sep{height:1px;background:var(--line)}
.bp-help{font-size:11px;color:var(--muted);line-height:1.45}
.bp-ctx{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.bp-ctx-h{padding:9px 11px;border-bottom:1px solid var(--line);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted)}
.bp-ctx-b{padding:10px 11px;display:flex;gap:7px;flex-wrap:wrap}
.bp-ctx-b .cq{width:52px;height:52px;border-radius:6px;border:1px solid var(--line);object-fit:cover;background:var(--soft)}
.bp-ctx-f{padding:8px 11px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.bp-ctx-e{padding:12px 11px;font-size:11.5px;color:var(--muted)}
@media(max-width:900px){
  .bp-cols{grid-template-columns:1fr}
  .bp-side{border-left:none;border-top:1px solid var(--line);padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  .bp-rail{position:static}
  .bp-main{padding:18px 15px 24px}
  .bp-title{font-size:23px}
}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.f-full{grid-column:1/-1}
.field label{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.09em}
.field input,.field select,.field textarea{width:100%}
/* ── the action bar ────────────────────
   One primary, sitting last where the eye finishes. Everything else is an
   outline, so there is exactly one filled thing on the row and it is always
   the move the task is actually waiting for. */
.modal-actions{display:flex;gap:9px;margin-top:18px;align-items:center;flex-wrap:wrap}
.ma-gap{flex:1 1 auto}
/* Close · Save · the primary move wrap as ONE group. Letting them break
   individually stranded Close on the row above the button it belongs beside. */
.ma-end{display:flex;gap:9px;margin-left:auto;flex-wrap:nowrap}
.ma-more{position:relative}
.mbtn-more{padding:10px 14px;line-height:1}
.moremenu{position:absolute;bottom:calc(100% + 7px);left:0;z-index:40;min-width:230px;
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:6px;
  box-shadow:0 14px 40px rgba(23,23,23,.19);display:none;flex-direction:column;gap:2px}
.moremenu.open{display:flex}
[data-theme="dark"] .moremenu{box-shadow:0 14px 40px rgba(0,0,0,.55)}
.moremenu .mm{border:0;background:none;text-align:left;padding:9px 11px;border-radius:9px;
  font-size:12.5px;font-weight:500;letter-spacing:0;width:100%}
.moremenu .mm:hover{background:var(--soft)}
.moremenu .mm.btn-warn{background:none;color:var(--s-late)}
.moremenu .mm.btn-warn:hover{background:var(--soft)}
.moremenu .mm.btn-danger{background:none;color:var(--s-late)}
.moremenu .mm.btn-danger:hover{background:var(--s-late);color:#fff}
.mbtn-primary{box-shadow:0 3px 12px color-mix(in srgb,var(--accent) 32%,transparent)}
/* Save arrives asleep and wakes on the first edit — it was the brightest thing
   in the panel while having nothing to save. */
#save-btn{border:1px solid var(--pill-line);background:var(--card)}
#save-btn:disabled{opacity:.4;cursor:default}
#save-btn.btn-p{border-color:transparent;background:var(--accent);color:var(--accent-ink);opacity:1}
/* ── the task panel: where it is, whose move, who has it ──────────────────
   Four segments, because the studio's flow has four moments. The one you are
   at is filled; the ones behind you are quiet ticks; the ones ahead are just
   outlines. You can read your position without reading a word. */
.trail{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0 13px}
.trs{position:relative;font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);padding-top:9px;text-align:center}
.trs::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:99px;background:var(--line)}
.trs.done{color:var(--ink)}
.trs.done::before{background:var(--pill-line)}
.trs.at{color:var(--accent)}
.trs.at::before{background:var(--accent)}
.trs.rej.at{color:var(--s-late)} .trs.rej.at::before{background:var(--s-late)}

/* whose move it is, in a sentence, before anything else */
.tmove{font-size:13px;line-height:1.5;padding:10px 13px;border-radius:11px;margin-bottom:13px;
  background:var(--soft);border-left:3px solid var(--pill-line)}
.tmove.t-act{border-left-color:var(--accent)}
.tmove.t-review{border-left-color:var(--s-review)}
.tmove.t-late{border-left-color:var(--s-late)}
.tmove.t-good{border-left-color:var(--s-good)}

/* who asked, and who is doing it — the first thing anyone wants to know */
.twho-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.twho{min-width:0}
.twho-l{display:block;font-size:9px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px}
.twho-n{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.twho-n b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.twho-n small{display:block;font-size:10px;color:var(--muted);font-weight:400}

/* ── creatives: a version is several files ────────────────────────────────
   The .cdr the vendor needs, the .pdf for print and the .jpg anyone can
   actually open are one piece of artwork, so they are shown as one block. The
   non-previewable ones are named and downloadable and never pretend to be
   previews — which is exactly the complaint that started this. */
.crs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:10px}
/* THE GRAPHIC BOARD IS MASONRY, not a grid of equal boxes. A tall A3 poster and
   a wide web banner keep their real shape, so the assigner recognises the work
   instead of decoding thumbnails cropped to a common height. Column flow does
   this in CSS with no layout library and no measuring. */
.crs-board{display:block;column-count:4;column-gap:10px;grid-template-columns:none}
.crs-board .cr{break-inside:avoid;margin:0 0 10px;display:inline-block;width:100%}
@media(max-width:1180px){.crs-board{column-count:3}}
@media(max-width:820px){.crs-board{column-count:2}}
@media(max-width:520px){.crs-board{column-count:1}}
/* the picture Drive already made - never the file itself */
/* whether YOU have opened it - the board doubles as a list of what you still
   owe an answer on */
.cr-seen,.cr-unseen{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;font-weight:700;white-space:nowrap}
.cr-seen{color:var(--muted);opacity:.7}
.cr-unseen{color:var(--s-warn,#e2b45c);background:color-mix(in srgb,var(--s-warn,#e2b45c) 12%,transparent)}
.cr-gate{font-size:11px;color:var(--s-warn,#e2b45c)}
.rv-verdict{display:inline-flex;gap:7px}
.rv-verdict .btn.on{outline:1px solid var(--accent);outline-offset:-1px}
.cr-t{position:relative;background:var(--soft);min-height:60px;display:block}
.cr-t img{display:block;width:100%;height:auto}
.cr-t-none{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:26px 12px;text-align:center;border-bottom:1px solid var(--line)}
.cr-t-ic{font-size:21px;color:var(--muted);opacity:.7}
.cr-t-none b{font-size:11.5px;color:var(--muted)}
.cr-t-s{font-size:10px;color:var(--muted);opacity:.8;line-height:1.4}
/* the remedy for a file Drive will not render - a picture the designer supplies */
.cr-addp{margin-top:8px;padding:5px 10px;font-size:10.5px}
/* one note for the whole drop - sits with the tabs, where the assigner already is */
.cr-drop{margin-left:auto;color:var(--s-warn,#e2b45c);text-decoration:none;border:1px solid transparent}
.cr-drop:hover{border-color:var(--s-warn,#e2b45c);border-radius:999px;padding:5px 11px}
/* THIRTY FILES HAVE TO BE SCANNABLE. A column of rows made the graphic team
   scroll past work they were trying to compare; a grid puts the whole set in
   one eyeful. Single column on a phone, where a grid is just a narrow list. */
@media(max-width:640px){.crs{grid-template-columns:1fr}}
.cr{position:relative}
.cr-pick{position:absolute;top:8px;right:8px;z-index:2;display:flex;padding:4px;cursor:pointer}
.cr-pick input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}
.cr-sel{outline:2px solid var(--accent);outline-offset:-2px}
.cr-h{padding-right:34px}
.cr-sup{padding:7px 12px;font-size:11px;line-height:1.45;color:var(--muted);
  background:color-mix(in srgb,var(--s-good) 7%,transparent);border-top:1px solid var(--line)}
.dz-grp{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.dz-grp label{flex:none;letter-spacing:.02em}
.dz-grp select{flex:1;min-width:0;font-size:11.5px;padding:6px 8px}
.dz-sm{padding:14px 12px;margin-bottom:10px}
.dz-sm .dz-ic{font-size:18px}
.dz-sm b{font-size:12px}
.dz-sm .dz-sub{font-size:10.5px}
.rv-drop{padding:0 2px}
.cr-tabs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.cr-tab{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;
  padding:5px 12px;font:600 11px/1 inherit;letter-spacing:.03em;cursor:pointer}
.cr-tab.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.cr-tab-act{margin-left:auto;flex:none;padding:5px 12px;font-size:11px}
.cr-tab-sel{background:none;border:none;color:var(--muted);font:600 11px inherit;

.cr-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-height:34px;margin-bottom:9px;

.cr-bar-hint{color:var(--muted);font-size:11px}

.fl-row{display:flex;align-items:stretch}
.fl-row .fl{flex:1;min-width:0}
.fl-dl{flex:none;background:none;border:none;border-left:1px solid var(--line);color:var(--muted);
  padding:0 11px;font-size:13px;cursor:pointer}
.fl-dl:hover{color:var(--accent);background:var(--soft)}
.fl-dl:disabled{opacity:.5;cursor:default}
.cr{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card2)}
.cr-h{display:flex;align-items:baseline;gap:9px;padding:9px 12px;background:var(--soft);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.cr-h b{font-size:12.5px;font-weight:600}
.cr-m{font-size:10px;color:var(--muted);letter-spacing:.04em}
.cr-f{display:flex;flex-direction:column}
/* the decision standing against this creative, said on the block itself */
.cr-s{margin-left:auto;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap}

.cr-a{display:flex;gap:7px;padding:9px 12px;border-top:1px solid var(--line)}
.cr-btn{padding:5px 12px;font-size:11px;border:1px solid var(--pill-line);background:var(--card);border-radius:99px}
.cr-btn:hover{border-color:var(--s-good);color:var(--s-good)}
.cr-btn.on{background:var(--s-good);border-color:var(--s-good);color:#fff}
.cr-btn-no:hover{border-color:var(--s-late);color:var(--s-late)}
.cr-btn-no.on{background:var(--s-late);border-color:var(--s-late);color:#fff}
.fl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink);text-decoration:none}

  justify-content:center;font-size:12px;background:var(--soft);color:var(--muted)}

.fl-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── the deliverable drop zone ────────────────────────────────────────────
   A real target, not a button: the file is the single most common thing anyone
   attaches, and after a revision round it is the ONLY thing they came here to
   do. Dashed while idle so it reads as "put something here" rather than as a
   filled control. */
.dz{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;
  padding:20px 16px;border:1.5px dashed var(--pill-line);border-radius:13px;cursor:pointer;
  background:var(--soft);transition:border-color .15s,background .15s,transform .12s}
.dz:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--soft))}
.dz:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dz.over{border-color:var(--accent);border-style:solid;
  background:color-mix(in srgb,var(--accent) 14%,var(--soft));transform:scale(1.01)}
.dz .dz-ic{font-size:20px;line-height:1;color:var(--accent)}
.dz b{font-size:13px;font-weight:600}
.dz .dz-sub{font-size:11px;color:var(--muted);max-width:34ch;line-height:1.45}
/* what is already on the task, named before you are asked to replace it */
.dz-has{display:flex;align-items:center;gap:9px;font-size:12px;margin-bottom:8px;
  padding:8px 11px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.dz-tick{color:var(--s-good)}
.dz-hasname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dz-has a{font-weight:600;white-space:nowrap}
.dz-rm{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);
  border-radius:99px;padding:3px 10px;white-space:nowrap}
.dz-rm:hover{color:var(--s-late);border-color:color-mix(in srgb,var(--s-late) 50%,var(--line))}
.dz-rm[data-armed="1"]{color:#fff;background:var(--s-late);border-color:var(--s-late)}
/* the link + Upload row sits under the box, as the typed alternative */
.dz-link{margin-top:9px}
@media (max-width:740px){
  .dz{padding:16px 13px}
  .dz .dz-sub{font-size:10.5px}
}

/* the file is the point of the task, so it is the field you land on */
.t-hero{margin-bottom:11px}
.t-hero label{color:var(--ink)}

/* Twelve fields that almost never change, folded away. Team, priority, due
   time and brief are set once at creation; putting them at the same weight as
   the deliverable is what made this panel feel like a form. */
.tdet{margin:4px 0 2px;border-top:1px solid var(--line);padding-top:11px}
.tdet summary{cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);list-style:none;display:flex;align-items:center;gap:7px;padding:3px 0}
.tdet summary::-webkit-details-marker{display:none}
.tdet summary::before{content:'▸';font-size:10px;transition:transform .18s}
.tdet[open] summary::before{transform:rotate(90deg)}
.tdet summary:hover{color:var(--ink)}
.tdet .fgrid{margin-top:12px}

/* the quiet confirmation that replaced the Save button */
.savemark{font-size:11px;color:var(--muted);opacity:0;transition:opacity .2s;align-self:center;
  letter-spacing:.04em}
.savemark.on{opacity:1}
.savemark.bad{color:var(--s-late);font-weight:600}

@media (max-width:740px){ .twho-pair{grid-template-columns:1fr;gap:11px} }

.byline{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;font-weight:500}

.btn{border-radius:99px;padding:10px 17px;font-weight:500;font-size:12.5px;letter-spacing:.02em}
.btn:disabled{opacity:.55;cursor:wait}
.btn-p{background:var(--accent);color:var(--accent-ink)}.btn-p:hover{filter:brightness(.94)}
.btn-g{border:1px solid var(--pill-line);background:var(--card)}.btn-g:hover{border-color:var(--accent);color:var(--accent)}
.btn-ok{background:var(--ink);color:var(--bg)}
.btn-warn{border:1px solid var(--accent);color:var(--accent);background:transparent}
.btn-danger{border:1px solid var(--pill-line);color:var(--muted);background:transparent}
.btn-danger:hover{border-color:var(--accent);color:var(--accent)}

#toasts{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px}

@media (max-width:1000px){#app.ready{grid-template-columns:1fr}#rail{flex-direction:row;align-items:center;gap:6px;overflow-x:auto;padding:10px}.rail-spacer,.logo-sub,.acct .links{display:none}.acct{margin:0 0 0 auto;padding:7px}#newtask-btn{margin:0}.greet .name{font-size:30px}#notif-panel{right:10px}}

/* ── phone layout (bottom tab bar) ─────────────────────────── */
/* Column count is set by renderNav from the actual tab list — a head sees seven
   tabs plus the + button and the old hard-coded 6 columns overflowed the bar
   off the side of a phone. */
/* ══ THE EXPANDABLE BAR (phones) ══════════════════════════════════════════
   Eight destinations across 390px is not a bar, it is a row of 44px targets
   with clipped words — and the last two fell off the end of the screen
   entirely, which is how Calendar and Reports became unreachable on a phone.

   So the bar holds four targets and a detached ＋, and the fourth target grows
   the pill upward into the whole set with real labels. Nothing was removed. */
#tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;
  align-items:flex-end;gap:10px;padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
.tb-pill{flex:1;min-width:0;border-radius:22px;overflow:hidden;
  background:var(--card);border:1px solid var(--line);
  transition:border-radius .32s cubic-bezier(.2,.8,.24,1)}
.tb-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:5px 6px}
#tabbar .tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;
  border-radius:14px;color:var(--muted);font-weight:500;position:relative;overflow:hidden;
  transition:background .18s,color .18s}
/* Icons only in the row — eight legible words will not fit, and half a word is
   worse than none. The name still ships in the markup for screen readers. */
#tabbar .tb{font-size:0;letter-spacing:0}
#tabbar .tb .ic{font-size:20px;line-height:1}
#tabbar .tb.active{color:var(--accent);background:var(--soft)}
#tabbar .nb{position:absolute;top:3px;right:18%;background:var(--accent);color:var(--accent-ink);
  font-size:8.5px;font-weight:500;border-radius:99px;padding:0 5px;line-height:1.5;letter-spacing:0}

/* the detached round button, exactly as in the reference */
.tb-fab{flex:none;width:54px;height:54px;font-weight:400;border-radius:99px;
  background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 42%,transparent);
  transition:transform .3s cubic-bezier(.34,1.4,.5,1),background .2s}
.tb-fab .plus{font-size:24px;line-height:1;display:block}
#tabbar.panel .tb-fab{transform:rotate(135deg)}

/* ── expanded ──
   The grid is laid out at all times and revealed by growing its row track from
   0fr to 1fr, so the pill animates its own height without anyone measuring
   anything in JavaScript. */
.tb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:0 6px;overflow:hidden;
  max-height:0;opacity:0;
  transition:max-height .34s cubic-bezier(.2,.8,.24,1),opacity .2s ease,padding .34s}
#tabbar.panel .tb-grid{max-height:260px;opacity:1;padding:10px 6px 10px}
#tabbar.panel .tb-pill{border-radius:26px}
/* The row steps aside rather than sitting under the grid — otherwise the tab
   you are on appears twice, once named and once not. */
.tb-row{transition:max-height .3s cubic-bezier(.2,.8,.24,1),opacity .16s ease,padding .3s;
  max-height:70px;overflow:hidden}
#tabbar.panel .tb-row{max-height:0;opacity:0;padding-top:0;padding-bottom:0}
.tg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 3px 9px;
  border-radius:14px;color:var(--muted);font-weight:500;position:relative;
  font-size:9px;letter-spacing:.06em;text-transform:uppercase;line-height:1.25;text-align:center}
.tg .ic{font-size:19px;line-height:1}
.tg.on{color:var(--accent);background:var(--soft)}
.tg:active{background:var(--soft)}
#tb-scrim{position:fixed;inset:0;z-index:69;background:rgba(4,7,6,.42);opacity:0;pointer-events:none;
  transition:opacity .26s ease;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:none}
@media (max-width:740px){ #tb-scrim{display:block} }
#tb-scrim.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){
  .tb-grid,.tb-pill,.tb-fab{transition:none}
}

/* ── the add pill ─────────────────────────────────────────────────────────
   Tapping ＋ on a phone expands it into a pill offering Add task / Add
   project. The two choices SHUFFLE out from under the button rather than
   appearing at once, so the eye follows where they came from. */
#tabbar.addopen .tb-fab{transform:rotate(135deg)}
.add-scrim{position:fixed;inset:0;z-index:74;background:rgba(20,20,15,.34);opacity:0;pointer-events:none;
  transition:opacity .22s ease;backdrop-filter:blur(1.5px)}
.add-scrim.on{opacity:1;pointer-events:auto}
.add-pill{position:fixed;left:50%;transform:translateX(-50%);z-index:75;
  bottom:calc(78px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:9px;align-items:center}
.add-pill.on{display:flex}
.add-pill button{display:flex;align-items:center;gap:10px;white-space:nowrap;
  background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:99px;padding:12px 20px 12px 15px;font-weight:500;font-size:14px;
  box-shadow:0 8px 26px rgba(20,20,15,.22);
  opacity:0;transform:translateY(26px) scale(.86);
  animation:pill-in .34s cubic-bezier(.2,1.25,.4,1) forwards}
.add-pill button:nth-child(1){animation-delay:.02s}
.add-pill button:nth-child(2){animation-delay:.10s}   /* the shuffle */
.add-pill button .ic{width:30px;height:30px;border-radius:99px;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.add-pill button:active{transform:scale(.97)}
@keyframes pill-in{to{opacity:1;transform:translateY(0) scale(1)}}
@media (prefers-reduced-motion:reduce){
  .add-pill button{animation:none;opacity:1;transform:none}
  .tb-fab{transition:none}
}
#acct-sheet{position:fixed;top:60px;right:10px;width:272px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.2);z-index:75;display:none;padding:14px;font-size:11.5px;line-height:1.65}

/* ── gallery (Pinterest-style masonry) ───────────────────────────────────

.gallery{column-count:4;column-gap:14px}

@media (max-width:520px){.gallery{column-count:2;column-gap:10px}}

  border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .16s,border-color .16s}
.g-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.g-card img{display:block;width:100%;height:auto;background:var(--soft)}
.g-noimg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:150px;
  background:var(--soft);color:var(--muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.g-noimg .g-ic{font-size:26px}
.g-meta{padding:9px 11px 11px}
.g-t{font-weight:500;font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-s{color:var(--muted);font-size:10.5px;margin-top:4px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.g-count{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin:0 2px 10px}

/* ── campaigns ───────────────────────────────────────────────────────────
   A campaign card is read at a glance: colour stripe to identify it, the two
   numbers that matter, and a bar showing how much is behind you. */
.pj-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pj-head .g-count{margin:0}

@media (max-width:740px){
  #app.ready{grid-template-columns:1fr}

  #content{padding:16px 14px calc(100px + env(safe-area-inset-bottom))}
  .greet .name{font-size:29px;gap:9px}
  .ov-grid{grid-template-columns:1fr}

  .rep-head select{flex:1}
  #overlay{padding:0;align-items:flex-end}
  #ask{padding:0;align-items:flex-end}
  .modal{width:100%;max-height:94vh;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
  #notif-panel{left:8px;right:8px;width:auto;top:56px}
  .filters input[type=search]{min-width:120px;flex:1}
  .od-strip{font-size:12px}

  .statrail{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;padding-inline:14px;

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── the dot motif ────────────────────────────────────────────────────────
   The wordmark is already a dot-matrix face, so the dot is the one shape this
   product genuinely owns. It appears three ways and nowhere else: as a quiet
   ground texture, as the divider, and as every loading state in the app. */
.dotgrid{
  background-image:radial-gradient(var(--pill-line) 1px, transparent 1px);
  background-size:14px 14px;
  background-position:0 0;
}
.dotgrid-soft{
  background-image:radial-gradient(var(--line) 1px, transparent 1px);
  background-size:18px 18px;
}

/* Loading, everywhere. A row of dots lighting in sequence — the wordmark's own
   texture, moving. Replaces five different "Loading…" strings and the spinner. */
.dotbar{display:inline-flex;gap:5px;align-items:center;vertical-align:middle}
.dotbar i{width:6px;height:6px;border-radius:99px;background:var(--pill-line);display:block;
  animation:dotwave 1.1s ease-in-out infinite}
.dotbar i:nth-child(2){animation-delay:.09s}
.dotbar i:nth-child(3){animation-delay:.18s}
.dotbar i:nth-child(4){animation-delay:.27s}
.dotbar i:nth-child(5){animation-delay:.36s}
.dotbar i:nth-child(6){animation-delay:.45s}
@keyframes dotwave{
  0%,60%,100%{background:var(--pill-line);transform:scale(1)}
  30%{background:var(--accent);transform:scale(1.45)}
}
.dotload{display:flex;flex-direction:column;align-items:center;gap:11px;padding:26px 0;color:var(--muted);
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
/* A full-width version for the top of a view that is refreshing under you. */
.dotline{height:2px;width:100%;border-radius:99px;overflow:hidden;background:var(--soft);position:relative}
.dotline::after{content:'';position:absolute;inset:0;
  background-image:radial-gradient(var(--accent) 1px, transparent 1px);
  background-size:8px 2px;animation:dotslide .9s linear infinite}
@keyframes dotslide{from{background-position:0 0}to{background-position:8px 0}}

@media (prefers-reduced-motion:reduce){
  .dotbar i{animation:none;background:var(--accent);opacity:.55}
  .dotline::after{animation:none}
}

/* ── floating glass navigation (phones) ───────────────────────────────────
   The bar lifts off the bottom edge and floats, so content scrolls visibly
   beneath it instead of ending at a hard rail. Translucent with a blur, which
   is why it needs a solid fallback: without backdrop-filter a 72%-alpha bar
   over text is unreadable. */
@media (max-width:740px){
  #tabbar{
    left:0; right:0;
    bottom:calc(8px + env(safe-area-inset-bottom));
  }
  /* The glass is on the PILL now, not on the bar — the bar is only a layout row
     holding the pill and the detached button, and blurring it would smear a
     rectangle behind the round one too. */
  .tb-pill{
    background:color-mix(in srgb, var(--card) 76%, transparent);
    -webkit-backdrop-filter:blur(20px) saturate(1.5);
    backdrop-filter:blur(20px) saturate(1.5);
    box-shadow:0 10px 34px rgba(23,23,23,.16), 0 1px 0 rgba(255,255,255,.5) inset;
  }
  [data-theme="dark"] .tb-pill{
    box-shadow:0 10px 34px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.06) inset;
  }
  /* content must clear the floating bar, not sit under it */
  #content{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  @media (max-width:740px){ .tb-pill{background:var(--card)} }
}

@media print{
  #rail,#topbar,.filters,.rep-head,.cal-hint,#toasts,#notif-panel,#login{display:none!important}
  #app.ready{display:block}#content{overflow:visible;padding:0}
  body{background:#fff;color:#1b1b1b}.panel{border:none;padding:8px 0;break-inside:avoid}
  /* paper always gets the full table, never the phone card list — otherwise
     printing from a narrow window silently drops every column but the title */
  .tbl-wrap{display:block!important;overflow:visible!important}
  .mob-list{display:none!important}
  table.tasks{width:100%;border-collapse:collapse}
  table.tasks tr{break-inside:avoid}
}

<!-- ── THE WELCOME SCREEN ──────────────────────────────────────────────────
     The app opens here every time. A night meadow lit from inside: the sky is
     the product's own dot grid, the horizon glows, and the wordmark sits in it
     breathing. The controls are NOT part of that picture — they rise into it
     from below once the scene has settled, so the first thing anyone sees is
     the studio's name and not a form.

     Everything here is deliberately dark whatever the theme is set to. It is
     one committed image, not a surface that follows a preference. -->
<div id="login">
  <div class="w-sky" aria-hidden="true">
    <span class="w-stars"></span>
    <span class="w-bloom"></span>
    <span class="w-meadow"></span>
    <!-- The photograph sits ON TOP of the gradient scene, not instead of it.
         The single-file build (Apps Script's ?page=app, and the exe) has no
         second request to spend, so the image 404s there and the CSS meadow
         underneath simply shows through — same colours, same composition, no
         broken-looking screen. -->
    <span class="w-photo"></span>
    <span class="w-vig"></span>
  </div>

  <div class="w-mark">
    <span class="w-dots" aria-hidden="true"></span>
    <div class="w-cap"><img class="login-logo brandmark" alt="Creativeflow" width="560" height="127"></div>
  </div>

  <div class="w-dock" id="w-dock">
    <div class="login-err" id="login-err"></div>
    <!-- v5: Google sign-in markup REMOVED (owner's order in 4.9.2 — code-only
         login; the old build merely hid it). Do not re-add. Google/Drive still
         powers uploads; only the login path is gone. -->
    <div class="w-row"><label for="in-email">Your email</label>
      <input id="in-email" type="email" placeholder="you@studio.com" autocomplete="email" spellcheck="false"></div>
    <div class="w-row"><label>Code</label>
      <div class="w-code" id="w-code">
        <input inputmode="text" maxlength="1" aria-label="Code character 1">
        <input inputmode="text" maxlength="1" aria-label="Code character 2">
        <input inputmode="text" maxlength="1" aria-label="Code character 3">
        <input inputmode="text" maxlength="1" aria-label="Code character 4">
        <input inputmode="text" maxlength="1" aria-label="Code character 5">
        <input inputmode="text" maxlength="1" aria-label="Code character 6">
      </div>
      <!-- the real field the API reads; the boxes above write into it, and a
           paste / autofill / password manager writing here shows up in them -->
      <input id="in-code" class="w-code-real" maxlength="12" autocomplete="one-time-code" aria-hidden="true" tabindex="-1"></div>
    <button class="login-btn" id="login-btn">Open</button>
    <input type="checkbox" id="in-remember" checked class="w-hide">

  <!-- Which sheet this app talks to is set once, by an admin, and then never
       again. It has no business on the welcome screen, so it lives behind the

        Your admin deploys it once from the master sheet (Extensions ▸ Apps Script ▸ Deploy ▸ Web app) and shares the URL ending in <b>/exec</b>. Full steps are in the guide.
      </details>
    </div>
    <div class="saved-url" id="saved-url" style="display:none"></div>
    <div class="changelink" id="changelink" style="display:none"><a href="#" id="test-conn">Test connection</a> · <a href="#" id="change-url">Connect to a different sheet</a></div>
  </div>
</div>
