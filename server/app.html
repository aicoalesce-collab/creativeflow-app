<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreativeFlow</title>
<script>

  .card { max-width: 420px; padding: 40px 28px; line-height: 1.6; }
  h1 { font-family: monospace; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="card">
  <h1>CREATIVEFLOW</h1>
  <p><b>Server v5 is deployed and healthy.</b></p>
  <p>This is the placeholder shell — the real client build replaces this file
     (scripts/build-app.ps1 → server/app.html) before the team ever sees it.</p>
  <p id="api" style="font-size:12px;color:#8a867c"></p>
  <script>document.getElementById('api').textContent = window.CF_INJECTED_API ? 'API: ' + window.CF_INJECTED_API : '';</script>
</div>
