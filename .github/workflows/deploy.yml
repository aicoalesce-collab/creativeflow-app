name: Deploy the CreativeFlow client to Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Verify the CF-BOOT sentinels survived the build
        run: |
          set -e
          grep -q "window.CF_INJECTED_API = '';" web/dist/index.html
          grep -q "window.CF_GUEST_TOKEN = '';"  web/dist/index.html
          grep -q "window.CF_OPEN_TASK = '';"    web/dist/index.html
          grep -Eq "window\.APP_VERSION\s*=\s*'[0-9.]+'" web/dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
